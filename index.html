<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hapus Background</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Hapus Background</h1>

    <label id="dropzone" for="fileInput">
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" hidden>
      <span id="dropText">Klik atau seret gambar ke sini</span>
    </label>

    <p id="status" hidden></p>

    <section id="result" hidden>
      <div class="grid">
        <figure>
          <figcaption>Asli</figcaption>
          <div class="frame"><img id="original" alt="Gambar asli"></div>
        </figure>
        <figure>
          <figcaption>Hasil</figcaption>
          <div class="frame checker"><img id="output" alt="Gambar tanpa background"></div>
        </figure>
      </div>
      <button id="downloadBtn" type="button" disabled>Download PNG</button>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
